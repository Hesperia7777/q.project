<style>
:root{--bg:#eef1f6;--card:#fff;--fg:#17233b;--mute:#6b7894;--line:#cfd8e6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--fg:#e6ecf7;--mute:#9aa8c4;--line:#2c3a58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--fg:#e6ecf7;--mute:#9aa8c4;--line:#2c3a58;color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 "PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:11}
.bar{background:var(--card);border-bottom:1px solid var(--line);padding:6px 10px;display:grid;gap:5px}
.r1{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;align-items:baseline}
.bar h1{font-size:1rem;margin:0}
#st{font-size:.85rem;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
button,select{font:inherit;font-size:.85rem;padding:4px 9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;cursor:pointer}
button.on{background:#1f56b3;border-color:#1f56b3;color:#fff}
button.go{background:#d9731a;border-color:#d9731a;color:#fff}
#msg{min-height:1.1em;font-size:.8rem;color:#d9731a}
#wrap{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
#sz{position:relative}
#cv{position:absolute;left:0;top:0;width:1288px;height:945px;transform-origin:0 0}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.c{position:absolute;font-size:10.5px}
.c textarea{display:block;width:100%;font:inherit;font-size:inherit;line-height:1.15;padding:0 2px;border:1px solid var(--c);border-radius:3px;background:#fff;color:#17233b;resize:none;overflow:hidden;box-shadow:0 0 0 1px #fff}
.c textarea:focus{outline:2px solid color-mix(in srgb,var(--c) 45%,transparent);outline-offset:1px;position:relative;z-index:2}
.c.hd{font-size:12px}.c.hd textarea{font-weight:700}
.c.sm{font-size:5.5px}.c.sm textarea{padding:0 1px;text-align:center;border-width:.6px;border-radius:2px;font-weight:700}
.c.big{font-size:15px}.c.big textarea{font-weight:700;text-align:center}
.c.ti{font-size:22px}.c.ti textarea{font-weight:700;text-align:center;letter-spacing:22px;padding-left:22px}
.c.off,.reveal .c{visibility:hidden}
.c.cov textarea{opacity:.55;pointer-events:none;background:#e9edf4}
.c.ok textarea{background:#d3f2dc;border-color:#1e9b52;color:#0e4d28}
.c.bad textarea{background:#fde0e0;border-color:#d32f2f;color:#7a1111}
</style>

const FS={big:15,ti:22,hd:12,sm:5.5},HH={ti:15,big:11,sm:4};
const W=(a,f)=>Math.round([...a].reduce((s,ch)=>s+(ch.charCodeAt(0)>0x2e7f?f:f*.55),0)+8);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

const act=()=>$$('.c:not(.off):not(.cov)');

function fit(){setS(Math.min(1.4,wrap.clientWidth/1288))}
function grow(){$$('.c textarea').forEach(t=>{t.style.height='auto';t.style.height=Math.max(t.scrollHeight,t.offsetHeight)+'px'})}
function stats(){const c=act(),f=c.filter(x=>x.querySelector('textarea').value.trim()).length;
 $('#st').textContent=`已填 ${f}/${c.length}　正確 ${c.filter(x=>x.classList.contains('ok')).length}　錯誤 ${c.filter(x=>x.classList.contains('bad')).length}`}
function apply(zoom){$$('.c').forEach(c=>{const o=cur>=0&&+c.dataset.s!==cur;c.classList.toggle('off',o&&!cover);c.classList.toggle('cov',o&&cover)});
 $$('.tab').forEach(b=>b.classList.toggle('on',+b.dataset.t===cur));$('#oth').textContent='其他階段：'+(cover?'遮住':'顯示原文');
 if(zoom){if(cur<0){fit();wrap.scrollTo(0,0)}else{const r=R[cur];setS(wrap.clientWidth/r[2]);wrap.scrollTo(r[0]*s-6,r[1]*s-6)}}
 grow();stats()}
function grade(c,force){const v=c.querySelector('textarea').value;if(!v.trim()&&!force)return;const ok=norm(v)===norm(c.dataset.a);c.classList.toggle('ok',ok);c.classList.toggle('bad',!ok)}
function next(t){if(document.body.classList.contains('reveal'))return;const l=$$('.c:not(.off):not(.cov) textarea:not(:disabled)'),n=l[l.indexOf(t)+1];
 if(n){n.focus();n.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})}else{t.blur();say('已經是最後一格，可以按「交卷」。')}}
cv.addEventListener('keydown',e=>{if(e.target.tagName!=='TEXTAREA'||e.key!=='Enter'||e.isComposing||e.keyCode===229)return;
 e.preventDefault();if($('#mode').value==='now')grade(e.target.closest('.c'));stats();next(e.target)});
cv.addEventListener('input',e=>{e.target.closest('.c').classList.remove('ok','bad');e.target.value=e.target.value.replace(/\n/g,'');
 e.target.style.height='auto';e.target.style.height=Math.max(e.target.scrollHeight,0)+'px';stats()});
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){cur=+b.dataset.t;apply(true);say('')}};
$('#oth').onclick=()=>{cover=!cover;apply()};
$('#show').onclick=()=>document.body.classList.add('reveal');
$('#hide').onclick=()=>{document.body.classList.remove('reveal');grow()};
$('#sub').onclick=()=>{document.body.classList.remove('reveal');const c=act();c.forEach(x=>grade(x,true));grow();stats();say(`得分 ${c.filter(x=>x.classList.contains('ok')).length} / ${c.length}`)};
$('#redo').onclick=()=>{document.body.classList.remove('reveal');$$('.c').forEach(c=>{const t=c.querySelector('textarea');
 if(c.classList.contains('ok'))t.disabled=true;else if(c.classList.contains('bad')){t.value='';c.classList.remove('bad')}});
 grow();stats();const f=$('.c:not(.off):not(.cov) textarea:not(:disabled)');if(f)f.focus();say('已保留答對的格子，請重做錯題。')};
$('#rst').onclick=()=>{document.body.classList.remove('reveal');$$('.c').forEach(c=>{const t=c.querySelector('textarea');t.value='';t.disabled=false;c.classList.remove('ok','bad')});grow();stats();say('')};
$('#zi').onclick=()=>setS(s*1.2);$('#zo').onclick=()=>setS(s/1.2);
